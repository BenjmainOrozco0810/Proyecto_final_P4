<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketChat | Sala de Chat</title>
    <link rel="stylesheet" href="css/chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Header Sidebar -->
            <div class="sidebar-header">
                <div class="app-logo">
                    <div class="logo-icon">💬</div>
                    <h2>SocketChat</h2>
                </div>
                <div class="user-profile">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="username" id="current-user">Usuario</span>
                        <span class="user-status">🟢 En línea</span>
                    </div>
                </div>
            </div>

            <!-- Buscador -->
            <div class="search-container">
                <div class="search-icon">
                    <i class="fas fa-search"></i>
                </div>
                <input type="text" id="search-users" placeholder="Buscar usuarios...">
            </div>

            <!-- Lista de usuarios -->
            <div class="users-section">
                <h3 class="section-title">Usuarios Conectados</h3>
                <div id="users-list" class="users-list">
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No hay otros usuarios conectados</p>
                    </div>
                </div>
                <div class="online-count">
                    <span id="online-count">0</span> usuarios en línea
                </div>
            </div>

            <!-- Footer Sidebar -->
            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    Cerrar Sesión
                </button>
                <div class="project-info">
                    <span>UP - Programación IV</span>
                </div>
            </div>
        </aside>

        <!-- Área principal del chat -->
        <main class="chat-area">
            <!-- Header del chat -->
            <header class="chat-header">
                <div class="chat-info">
                    <div class="active-user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="active-user-info">
                        <h3 id="active-chat-title">Selecciona un chat</h3>
                        <span id="active-chat-status" class="chat-status">Para comenzar a conversar</span>
                    </div>
                </div>
                <div class="chat-actions">
                </div>
            </header>

            <!-- Mensajes -->
            <div id="messages-container" class="messages-container">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <h3>Bienvenido al Chat</h3>
                    <p>Selecciona un usuario de la lista para comenzar a chatear</p>
                </div>
            </div>

            <!-- Indicador de typing -->
            <div id="typing-indicator" class="typing-indicator" style="display: none;">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span id="typing-user">Alguien</span> está escribiendo...
            </div>

            <!-- Input de mensaje -->
            <div class="message-input-container">
                <div class="input-actions">
                </div>
                <input type="text" id="message-input" placeholder="Escribe un mensaje..." disabled>
                <button id="send-btn" class="send-btn" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
