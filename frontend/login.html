<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketChat - Inicio de Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="background-animation"></div> 

    <div class="login-wrapper"> 
        <div class="login-card">
            
            <div class="welcome-section">
                <i class="fas fa-comment-dots welcome-icon"></i>
                <h2>¡Bienvenido de Nuevo!</h2>
                <p>Inicia sesión para chatear con tus amigos.</p>
                <div class="university-info">
                    <p>Universidad Panamericana</p>
                    <p>Programación IV</p>
                </div>
            </div>

            <div class="form-section">
                <header class="form-header">
                    <h1>Iniciar Sesión</h1>
                    <p>En SocketChat<span class="up-highlight"></span></p>
                </header>
                
                <form id="login-form" class="login-form">
                    <div class="input-group">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="username" required placeholder="Usuario">
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" required placeholder="Contraseña">
                    </div>
                    
                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
                
                <footer class="form-footer">
                    <p>¿No tienes cuenta? <a href="/register" class="register-link">Regístrate aquí</a></p>
                </footer>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Mostrar loading
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML; 
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch(window.location.origin + '/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Login exitoso
                        localStorage.setItem('currentUser', username);
                        localStorage.setItem('userId', result.user.id);
                        
                        // Redirigir al chat
                        window.location.href = '/chat';
                    } else {
                        // Login fallido
                        alert('❌ ' + result.message);
                        // Limpiar campos
                        document.getElementById('password').value = '';
                    }
                } catch (error) {
                    alert('❌ Error de conexión con el servidor');
                    console.error('Error:', error);
                } finally {
                    // Restaurar botón
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } else {
                alert('Por favor ingresa usuario y contraseña');
            }
        });
    </script>
</body>
</html>
