<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp UP | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <div class="login-card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo">
                    <div class="logo-icon">💬</div>
                    <h1>ChatApp UP</h1>
                </div>
                <p class="subtitle">Sistema de Mensajería en Tiempo Real</p>
            </div>

            <!-- Formulario -->
            <form id="login-form" class="form">
                <div class="input-group">
                    <div class="input-icon">👤</div>
                    <input type="text" id="username" required placeholder="Nombre de usuario">
                </div>
                
                <div class="input-group">
                    <div class="input-icon">🔒</div>
                    <input type="password" id="password" required placeholder="Contraseña">
                </div>
                
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="btn-loader" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>

            <!-- Footer -->
            <div class="card-footer">
                <p>¿No tienes una cuenta? <a href="/register" class="link">Regístrate aquí</a></p>
                <div class="project-info">
                    <span>Universidad Panamericana - Programación IV</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = this.querySelector('.submit-btn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoader = submitBtn.querySelector('.btn-loader');
            
            if (username && password) {
                // Mostrar loading
                btnText.style.display = 'none';
                btnLoader.style.display = 'flex';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        localStorage.setItem('currentUser', username);
                        localStorage.setItem('userId', result.user.id);
                        
                        // Animación de éxito
                        submitBtn.style.background = '#10b981';
                        btnLoader.innerHTML = '✅';
                        
                        setTimeout(() => {
                            window.location.href = '/chat';
                        }, 500);
                    } else {
                        showError(result.message);
                    }
                } catch (error) {
                    showError('Error de conexión');
                } finally {
                    // Restaurar botón
                    setTimeout(() => {
                        btnText.style.display = 'block';
                        btnLoader.style.display = 'none';
                        submitBtn.disabled = false;
                        submitBtn.style.background = '';
                    }, 1000);
                }
            } else {
                showError('Por favor completa todos los campos');
            }
        });

        function showError(message) {
            // Crear notificación de error
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-notification';
            errorDiv.innerHTML = `
                <span>❌ ${message}</span>
            `;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 4000);
        }
    </script>
</body>
</html>
