<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketChat - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="background-animation"></div> 

    <div class="login-wrapper"> 
        <div class="login-card">
            
            <div class="welcome-section">
                <i class="fas fa-user-plus welcome-icon"></i>
                <h2>Únete a la Comunidad UP</h2>
                <p>Crea tu cuenta en segundos y comienza a chatear.</p>
                <div class="university-info">
                    <p>Universidad Panamericana</p>
                    <p>Programación IV</p>
                </div>
            </div>

            <div class="form-section">
                <header class="form-header">
                    <h1>Crear Cuenta</h1>
                    <p>¡Es rápido y fácil!</p>
                </header>
                
                <form id="register-form" class="login-form">
                    <div class="input-group">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="username" required placeholder="Elige un usuario único">
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" required placeholder="Crea una contraseña segura">
                    </div>
                    
                    <button type="submit" class="login-btn">
                        <i class="fas fa-arrow-right-to-bracket"></i> Registrarme
                    </button>
                </form>
                
                <footer class="form-footer">
                    <p>¿Ya tienes cuenta? <a href="/" class="register-link">Inicia sesión aquí</a></p>
                </footer>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Mostrar loading
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML; 
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
                submitBtn.disabled = true;

                try {
                    const response = await fetch(window.location.origin + '/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ Cuenta creada exitosamente. Redirigiendo al login...');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        alert('❌ Error: ' + result.message);
                    }
                } catch (error) {
                    alert('❌ Error de conexión: ' + error.message);
                } finally {
                    // Restaurar botón
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } else {
                alert('Por favor ingresa usuario y contraseña');
            }
        });
    </script>
</body>
</html>
