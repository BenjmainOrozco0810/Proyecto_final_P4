<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp UP - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>💬 ChatApp UP</h1>
            <p>Universidad Panamericana - Programación IV</p>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required placeholder="Ingresa tu usuario">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>
        
        <div class="project-info">
            <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
            <p><strong>Proyecto Final:</strong> Sistema de Chat en Tiempo Real</p>
        </div>
    </div>

    <!-- SOLO este script -->
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Mostrar loading
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Verificando...';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch(window.location.origin + '/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Login exitoso
                        localStorage.setItem('currentUser', username);
                        localStorage.setItem('userId', result.user.id);
                        
                        // Redirigir al chat
                        window.location.href = '/chat';
                    } else {
                        // Login fallido
                        alert('❌ ' + result.message);
                        // Limpiar campos
                        document.getElementById('password').value = '';
                    }
                } catch (error) {
                    alert('❌ Error de conexión con el servidor');
                    console.error('Error:', error);
                } finally {
                    // Restaurar botón
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            } else {
                alert('Por favor ingresa usuario y contraseña');
            }
        });
    </script>
</body>
</html>
