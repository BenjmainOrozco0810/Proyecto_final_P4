<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp UP - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>💬 ChatApp UP</h1>
            <p>Universidad Panamericana - Programación IV</p>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required placeholder="Ingresa tu usuario">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>
        
        <div class="project-info">
            <p><strong>Proyecto Final:</strong> Sistema de Chat en Tiempo Real</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
