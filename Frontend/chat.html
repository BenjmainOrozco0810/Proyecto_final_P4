<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp UP - Sala de Chat</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <h1>💬 ChatApp UP</h1>
                <span class="user-status">Conectado como: <span id="current-user">Usuario</span></span>
            </div>
            <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
        </header>

        <div class="chat-main">
            <!-- Sidebar - Lista de usuarios -->
            <aside class="users-sidebar">
                <h3>👥 Usuarios Conectados</h3>
                <div id="users-list" class="users-list">
                    <!-- Los usuarios se cargarán aquí dinámicamente -->
                </div>
                <div class="online-count">
                    <span id="online-count">0</span> usuarios en línea
                </div>
            </aside>

            <!-- Área principal de chat -->
            <main class="chat-area">
                <!-- Mensajes -->
                <div id="messages-container" class="messages-container">
                    <div class="system-message">
                        Bienvenido al chat. Los mensajes se muestran aquí.
                    </div>
                </div>

                <!-- Indicador de typing -->
                <div id="typing-indicator" class="typing-indicator" style="display: none;">
                    <span id="typing-user">Alguien</span> está escribiendo...
                </div>

                <!-- Input para enviar mensajes -->
                <div class="message-input-container">
                    <input type="text" id="message-input" placeholder="Escribe tu mensaje..." maxlength="500">
                    <button id="send-btn" class="send-btn">Enviar</button>
                </div>
            </main>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
