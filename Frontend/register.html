<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp UP - Registro</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>💬 ChatApp UP</h1>
            <p>Crear nueva cuenta</p>
        </div>
        
        <form id="register-form" class="login-form">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required placeholder="Elige un usuario único">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Crea una contraseña segura">
            </div>
            
            <button type="submit" class="login-btn">Crear Cuenta</button>
        </form>
        
        <div class="project-info">
            <p>¿Ya tienes cuenta? <a href="/">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                try {
                    const response = await fetch(window.location.origin + '/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ Cuenta creada exitosamente. Redirigiendo al login...');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        alert('❌ Error: ' + result.message);
                    }
                } catch (error) {
                    alert('❌ Error de conexión: ' + error.message);
                }
            } else {
                alert('Por favor completa todos los campos');
            }
        });
    </script>
</body>
</html>
